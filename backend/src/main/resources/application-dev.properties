# SnapFlow Dev Profile (Microsoft SQL Server)
# Use the SAME server/port, username and password that work when you log in with SSMS.
# Provide them via a .env file (see .env.example), OS env vars, or IntelliJ run-config env vars:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# If DB_PASSWORD is missing the password is EMPTY and SQL Server answers with
# error 18456 "Login failed for user 'sa'".
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=snapflow_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
# Never commit a real password. Set DB_PASSWORD in your environment or .env file.
spring.datasource.password=SnapFlow2026Db
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# CORS Configuration
snapflow.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
