spring.application.name=snapflow-backend

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/snapflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.username=root
